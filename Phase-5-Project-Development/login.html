{% extends "base.html" %}
{% block content %}
<div class="auth-page"><div class="auth-heading"><h1>PocketSmart</h1><p>AI-Powered Budget Planning</p></div>
<div class="auth-card"><h2>Welcome Back</h2><form method="post">
<div class="form-group"><label>Username</label><div class="input-icon"><span>●</span><input type="text" name="username" placeholder="Enter your username" required></div></div>
<div class="form-group"><label>Password</label><div class="input-icon"><span>▣</span><input type="password" name="password" placeholder="Enter your password" required></div></div>
<div class="forgot"><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></div>
<button type="submit" class="auth-button">Sign In →</button></form><p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Create Account</a></p></div></div>
{% endblock %}
