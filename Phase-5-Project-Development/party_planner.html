{% extends "base.html" %}
{% block content %}
<section class="planner-page"><div class="planner-heading blue-heading"><h1>Party Budget Planner</h1><p>Plan your perfect event with AI-powered budget recommendations</p></div>
<form method="post" class="planner-form reference-form"><div class="form-section"><h3>💲 Basic Information</h3><div class="form-grid"><div class="form-group"><label>Total Budget (₹)</label><input name="total_budget" type="number" min="1" value="{{ form_data.get('total_budget','5000') }}" required></div><div class="form-group"><label>Number of Guests</label><input name="num_guests" type="number" min="1" value="{{ form_data.get('num_guests','3') }}" required></div></div></div>
<div class="form-section"><h3>🎉 Event Details</h3><div class="form-grid"><div class="form-group"><label>Party Type</label><select name="party_type"><option {% if form_data.get('party_type','Wedding')=='Wedding' %}selected{% endif %}>Wedding</option><option>Birthday</option><option>Anniversary</option><option>Corporate</option></select></div><div class="form-group"><label>Venue Type</label><input name="venue_type" value="{{ form_data.get('venue_type','Home') }}" placeholder="Home / Hall / Outdoor"></div></div></div>
<div class="form-section"><h3>☷ Party Needs</h3><div class="needs-grid"><label class="need-card"><input type="checkbox" name="needs_catering" value="yes" {% if form_data.get('needs_catering',True) %}checked{% endif %}><span>🍴 Catering</span></label><label class="need-card"><input type="checkbox" name="needs_decoration" value="yes" {% if form_data.get('needs_decoration',False) %}checked{% endif %}><span>🎨 Decoration</span></label><label class="need-card"><input type="checkbox" name="needs_entertainment" value="yes" {% if form_data.get('needs_entertainment',True) %}checked{% endif %}><span>♫ Entertainment</span></label></div></div>
<div class="form-section"><h3>💬 Additional Requirements</h3><textarea name="additional_requirements" placeholder="Special requests, themes, dietary restrictions, etc.">{{ form_data.get('additional_requirements','') }}</textarea></div>
<button class="primary-submit" type="submit">▣ Generate Budget Plan</button></form>{% if result %}{% include "_result.html" %}{% endif %}</section>
{% endblock %}
