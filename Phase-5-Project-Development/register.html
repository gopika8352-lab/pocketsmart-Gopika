{% extends "base.html" %}
{% block content %}
<div class="auth-page"><div class="auth-heading"><h1>PocketSmart</h1><p>AI-Powered Budget Planning</p></div>
<div class="auth-card"><h2>Create Your Account</h2><form method="post">
<div class="form-group"><label>Username</label><div class="input-icon"><span>●</span><input type="text" name="username" placeholder="Choose a username" required></div></div>
<div class="form-group"><label>Email</label><div class="input-icon"><span>✉</span><input type="email" name="email" placeholder="Enter your email" required></div></div>
<div class="form-group"><label>Password</label><div class="input-icon"><span>▣</span><input type="password" name="password" placeholder="Create a strong password" required></div></div>
<div class="form-group"><label>Confirm Password</label><div class="input-icon"><span>✓</span><input type="password" name="confirm_password" placeholder="Confirm your password" required></div></div>
<button type="submit" class="auth-button">Create Account 👤+</button></form><p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Sign In</a></p></div></div>
{% endblock %}
